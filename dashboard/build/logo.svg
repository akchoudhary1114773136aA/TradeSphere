  <ellipse cx="110" cy="130" rx="65" ry="88" fill="none" stroke="#1E4D6B" stroke-width="1" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="110" y1="42" x2="110" y2="218" stroke="#1E4D6B" stroke-width="1.2" clip-path="url(#globe-clip)" style="fill:rgb(0, 0, 0);stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Trend chart overlay on globe -->
  <!-- Chart base line -->
  <line x1="40" y1="168" x2="178" y2="168" stroke="#0FA98E" stroke-width="1" stroke-opacity="0.4" clip-path="url(#globe-clip)" style="fill:rgb(0, 0, 0);stroke:rgb(15, 169, 142);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Ascending trend line (glowing) -->
  <polyline points="42,165 68,152 90,158 112,138 138,128 162,105 178,92" fill="none" stroke="#0FA98E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(15, 169, 142);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Glow repeat -->
  <polyline points="42,165 68,152 90,158 112,138 138,128 162,105 178,92" fill="none" stroke="#3FFFD2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(63, 255, 210);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:round;stroke-linejoin:round;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Dot at tip of chart line -->
  <circle cx="178" cy="92" r="5" fill="#0FA98E" clip-path="url(#globe-clip)" style="fill:rgb(15, 169, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="178" cy="92" r="3" fill="#3FFFD2" clip-path="url(#globe-clip)" style="fill:rgb(63, 255, 210);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Globe outer ring -->
  <circle cx="110" cy="130" r="88" fill="none" stroke="#0FA98E" stroke-width="2" style="fill:none;stroke:rgb(15, 169, 142);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Small upward arrow accent outside top-right of globe -->
  <polygon points="198,55 208,38 218,55" fill="#0FA98E" opacity="0.85" style="fill:rgb(15, 169, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.85;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="208" y1="55" x2="208" y2="70" stroke="#0FA98E" stroke-width="2.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(15, 169, 142);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Wordmark -->
  <text x="228" y="113" font-family="'Sora', 'Segoe UI', sans-serif" font-size="54" font-weight="700" fill="#F0F4F8" letter-spacing="-1" style="fill:rgb(240, 244, 248);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, sans-serif;font-size:54px;font-weight:700;text-anchor:start;dominant-baseline:auto">Trade</text>
  <text x="228" y="166" font-family="'Sora', 'Segoe UI', sans-serif" font-size="54" font-weight="300" fill="#0FA98E" letter-spacing="2" style="fill:rgb(15, 169, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, sans-serif;font-size:54px;font-weight:300;text-anchor:start;dominant-baseline:auto">sphere</text>

  <!-- Tagline -->
  <text x="230" y="196" font-family="'Sora', 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#6B8CA8" letter-spacing="3.5" style="fill:rgb(107, 140, 168);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Sora, &quot;Segoe UI&quot;, sans-serif;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">GLOBAL MARKETS PLATFORM</text>

  <!-- Thin separator line under wordmark -->
  <line x1="228" y1="178" x2="628" y2="178" stroke="#1E4D6B" stroke-width="1" mask="url(#imagine-text-gaps-jhanns)" style="fill:rgb(0, 0, 0);stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>