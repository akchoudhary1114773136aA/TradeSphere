<svg width="100%" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Tradesphere Logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Tradesphere logo with a stylized globe and upward trend line</desc>
  <defs>
    <clipPath id="globe-clip">
      <circle cx="110" cy="130" r="88"/>
    </clipPath>
    
  <mask id="imagine-text-gaps-jhanns" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="260" fill="white"/><rect x="224" y="62.333335876464844" width="147.0729217529297" height="64" fill="black" rx="2"/><rect x="224" y="115.33333587646484" width="185.11459350585938" height="64" fill="black" rx="2"/><rect x="226" y="180" width="261.03125" height="21.33333396911621" fill="black" rx="2"/></mask></defs>

  <!-- Globe base circle -->
  <circle cx="110" cy="130" r="88" fill="#0D1B2A" style="fill:rgb(13, 27, 42);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  
  <!-- Latitude lines -->
  <ellipse cx="110" cy="130" rx="88" ry="28" fill="none" stroke="#1E4D6B" stroke-width="1.2" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="110" cy="105" rx="80" ry="22" fill="none" stroke="#1E4D6B" stroke-width="1" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="110" cy="155" rx="80" ry="22" fill="none" stroke="#1E4D6B" stroke-width="1" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="110" cy="80" rx="60" ry="16" fill="none" stroke="#1E4D6B" stroke-width="0.8" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="110" cy="180" rx="60" ry="16" fill="none" stroke="#1E4D6B" stroke-width="0.8" clip-path="url(#globe-clip)" style="fill:none;stroke:rgb(30, 77, 107);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

