<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <!-- Icon: rounded square background -->
  <rect x="0" y="5" width="40" height="40" rx="7" fill="#387ED1"/>

  <!-- Globe circle -->
  <circle cx="20" cy="25" r="13" stroke="white" stroke-width="2.2" fill="none"/>
  <!-- Vertical center line (longitude) -->
  <ellipse cx="20" cy="25" rx="6" ry="13" stroke="white" stroke-width="1.6" fill="none"/>
  <!-- Horizontal center line (equator) -->
  <line x1="7" y1="25" x2="33" y2="25" stroke="white" stroke-width="1.6"/>
  <!-- Upper latitude arc -->
  <path d="M9,18 Q20,21 31,18" stroke="white" stroke-width="1.4" fill="none"/>
  <!-- Lower latitude arc -->
  <path d="M9,32 Q20,29 31,32" stroke="white" stroke-width="1.4" fill="none"/>

  <!-- Wordmark -->
  <text x="50" y="34" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#387ED1" letter-spacing="0.5">TradeSphere</text>
</svg>
